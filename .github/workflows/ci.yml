name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails if worker-configuration.d.ts has drifted from wrangler.jsonc.
      #
      # `wrangler types` adds one key per secret in .dev.vars, so the check
      # needs the same secret *names* a developer has - and CI has no
      # .dev.vars to supply them. .dev.vars.example is that declaration; only
      # its keys matter here, never its placeholder values. Removed again so
      # every step below runs against the environment they were written for:
      # no .dev.vars, and the bindings worker/vitest.config.ts pins itself.
      - name: Check Worker types are current
        run: |
          cp .dev.vars.example .dev.vars
          npm run worker:types:check
          rm .dev.vars

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (service)
        run: npm run build:service

      - name: Build (bring-your-own-key)
        run: npm run build:byok

      # The only check that runs the real bundle, the real service-worker
      # registration and the real CSP together. Everything else in the suite
      # runs modules in isolation, where none of those exist.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end (record -> transcribe -> copy)
        run: npm run test:e2e

      # Fails the build on a known high-severity advisory rather than
      # reporting one into a log nobody reads. Moderate and below are noisy
      # enough in a dev-dependency tree to be worth reviewing by hand.
      - name: Audit dependencies
        run: npm audit --audit-level=high
