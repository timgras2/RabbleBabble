name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails if worker-configuration.d.ts has drifted from wrangler.jsonc.
      #
      # `wrangler types` adds one key per secret in .dev.vars, so the check
      # needs the same secret *names* a developer has - and CI has no
      # .dev.vars to supply them. .dev.vars.example is that declaration; only
      # its keys matter here, never its placeholder values. Removed again so
      # every step below runs against the environment they were written for:
      # no .dev.vars, and the bindings worker/vitest.config.ts pins itself.
      - name: Check Worker types are current
        run: |
          cp .dev.vars.example .dev.vars
          npm run worker:types:check
          rm .dev.vars

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (service)
        run: npm run build:service

      - name: Build (bring-your-own-key)
        run: npm run build:byok
